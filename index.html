<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>piano-box · 音乐盒钢琴</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23534ab7'/><rect x='7' y='9' width='3' height='14' rx='1.5' fill='white' opacity='.7'/><rect x='12' y='6' width='3' height='17' rx='1.5' fill='white'/><rect x='17' y='11' width='3' height='12' rx='1.5' fill='white' opacity='.8'/><rect x='22' y='8' width='3' height='15' rx='1.5' fill='white' opacity='.6'/></svg>" />
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <div>
          <h1>piano-box</h1>
          <p class="subtitle">任意键，转动乐曲的齿轮</p>
        </div>
      </div>
      <nav class="mode-switch" id="modeSwitch" aria-label="演奏模式">
        <button class="mode-btn active" data-mode="manual">音乐盒 · 手动</button>
        <button class="mode-btn" data-mode="auto">音乐盒 · 自动</button>
        <button class="mode-btn locked" data-mode="free" disabled title="自由钢琴模式 · 后续版本">自由钢琴 <span class="soon">即将推出</span></button>
      </nav>
    </header>

    <div class="status-banner" id="statusBanner" hidden></div>

    <main class="layout">
      <!-- 左侧：乐曲与控制 -->
      <section class="panel left-panel">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="导入 MIDI 文件">
          <div class="dropzone-icon">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <p class="dz-title">导入 MIDI 乐曲</p>
          <p class="dz-hint">点击选择或拖放 .mid / .midi 文件</p>
          <input type="file" id="fileInput" accept=".mid,.midi,audio/midi" hidden />
        </div>

        <div class="song-info" id="songInfo" hidden>
          <div class="song-title-row">
            <span class="song-name" id="songName">—</span>
            <button class="icon-btn" id="changeSong" title="更换乐曲">更换</button>
          </div>
          <div class="stat-grid">
            <div class="stat"><span class="stat-label">时长</span><span class="stat-value" id="statDuration">—</span></div>
            <div class="stat"><span class="stat-label">BPM</span><span class="stat-value" id="statBpm">—</span></div>
            <div class="stat"><span class="stat-label">事件</span><span class="stat-value" id="statEvents">—</span></div>
            <div class="stat"><span class="stat-label">音符</span><span class="stat-value" id="statNotes">—</span></div>
          </div>
        </div>

        <div class="track-section" id="trackSection" hidden>
          <div class="section-head">
            <h2>演奏轨道</h2>
            <label class="check-inline"><input type="checkbox" id="mergeTracks" checked /> 合并全部</label>
          </div>
          <div class="track-list" id="trackList"></div>
        </div>

        <div class="controls-section" id="controlsSection" hidden>
          <div class="section-head"><h2>转轴控制</h2></div>

          <div class="manual-controls" id="manualControls">
            <button class="primary-btn" id="nextBtn">下一步 <kbd>任意键</kbd></button>
            <p class="control-hint">按下任意普通键，或点击按钮，推进到下一个音符 / 和弦。长按不会连续触发。</p>
          </div>

          <div class="auto-controls" id="autoControls" hidden>
            <div class="transport-row">
              <button class="icon-btn round" id="playBtn" title="播放">▶</button>
              <button class="icon-btn round" id="pauseBtn" title="暂停">❚❚</button>
              <button class="icon-btn round" id="resumeBtn" title="继续">↻</button>
              <button class="icon-btn round" id="stopBtn" title="停止">■</button>
              <button class="icon-btn round" id="restartBtn" title="从头开始">⏮</button>
            </div>
          </div>

          <div class="slider-row">
            <label for="bpmSlider">BPM <span id="bpmValue">120</span></label>
            <input type="range" id="bpmSlider" min="40" max="240" value="120" />
          </div>
          <div class="slider-row">
            <label for="volumeSlider">音量 <span id="volumeValue">70%</span></label>
            <input type="range" id="volumeSlider" min="0" max="100" value="70" />
          </div>
          <label class="check-row"><input type="checkbox" id="loopChk" /> 循环播放</label>
        </div>
      </section>

      <!-- 右侧：可视化 -->
      <section class="panel right-panel">
        <div class="visual-head">
          <div>
            <h2>音符时间线</h2>
            <p class="hint" id="progressText">等待导入乐曲…</p>
          </div>
          <div class="event-counter">
            <span id="eventCurrent">0</span><span class="slash">/</span><span id="eventTotal">0</span>
          </div>
        </div>

        <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>

        <div class="piano-wrap">
          <div class="piano" id="piano"></div>
          <p class="hint piano-hint" id="pianoHint">当前音符会在这里高亮</p>
        </div>

        <div class="note-readout">
          <div class="readout-block">
            <span class="readout-label">当前</span>
            <div class="note-pills" id="currentNotes"><span class="empty-pill">—</span></div>
          </div>
          <div class="readout-block">
            <span class="readout-label">即将</span>
            <div class="note-pills" id="nextNotes"><span class="empty-pill">—</span></div>
          </div>
        </div>

        <div class="timeline" id="timeline">
          <div class="timeline-empty" id="timelineEmpty">导入乐曲后显示音符时间线</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>采样：Salamander Grand Piano (CC BY 3.0) · Alexander Holm</span>
      <span id="engineStatus">引擎：待初始化</span>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
